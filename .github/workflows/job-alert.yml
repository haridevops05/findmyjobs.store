name: FindMyJobs Real-Time Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai playwright
          playwright install chromium
      
      - name: Run job scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
        run: |
          python scripts/alert.py
      
      - name: Commit state
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          if [ -f seen_jobs.json ]; then
            git add seen_jobs.json
            git commit -m "[skip ci] Update seen_jobs.json" || echo "No changes to commit"
          else
            echo "{}" > seen_jobs.json
            git add seen_jobs.json
            git commit -m "[skip ci] Initialize seen_jobs.json"
          fi
          git push